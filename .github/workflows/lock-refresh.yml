# Temporary migration workflow: upgrade the committed lockfile in this feature branch.
name: Regenerate dependency lock
on:
  push:
    branches: ["feat/gamecaptioner-2"]
    paths:
      - package.json
      - .github/workflows/lock-refresh.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfile for patched Next.js"
            git push origin HEAD:feat/gamecaptioner-2
          fi
